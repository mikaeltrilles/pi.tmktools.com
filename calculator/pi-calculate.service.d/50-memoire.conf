# Plafonds memoire — ajoutes le 12 septembre 2026.
#
# Trois calculateurs (pi, phi, fibo) et les sessions de travail se partagent
# 14 Go sans aucun arbitrage. Quand la memoire manque, le noyau choisit sa
# victime selon son propre score : ce n'est pas forcement le service qui
# derape. Sur sept jours : 6 arrets par OOM, tous anterieurs a GMP.
#
# MemoryHigh est le mecanisme utile : au-dela, le noyau recupere agressivement
# la memoire de CE service, qui ralentit mais continue de tourner.
# MemoryMax est le garde-fou : au-dela, c'est CE service qui est arrete — et
# lui seul — puis relance par systemd depuis son dernier checkpoint.
#
# Pic mesure : 1,00 Go depuis le passage a GMP (11,8 Go avant)
[Service]
MemoryHigh=3G
MemoryMax=4500M
