# Plafonds mémoire — ajoutés le 12 septembre 2026.
# Plafond collectif et bride de swap ajoutés le 16 septembre 2026.
#
# Trois calculateurs (pi, phi, fibo) et les sessions de travail se partagent
# 14 Go sans aucun arbitrage. Quand la mémoire manque, le noyau choisit sa
# victime selon son propre score : ce n'est pas forcément le service qui
# dérape. Sur sept jours : 6 arrêts par OOM, tous antérieurs à GMP.
#
# MemoryHigh est le mécanisme utile : au-delà, le noyau récupère agressivement
# la mémoire de CE service, qui ralentit mais continue de tourner.
# MemoryMax est le garde-fou : au-delà, c'est CE service qui est arrêté — et
# lui seul — puis relancé par systemd depuis son dernier checkpoint.
#
# Pic mesuré : 1,00 Go depuis le passage à GMP (11,8 Go avant)
[Service]
MemoryHigh=3G
MemoryMax=4500M

# Le poste dispose de 12 Go de swap : 8 Go de fichiers sur NVMe, plus 4 Go
# compressés en RAM par zram, servis en premier. De quoi voir venir — mais pas
# pour ce service. La mémoire de travail d'un calcul en précision arbitraire est
# relue en permanence : la faire descendre dans le swap, fût-il compressé, ne
# libère rien durablement et fait passer la machine son temps à paginer ou à
# décompresser. C'est ce blocage-là, et non le manque de RAM, que l'on ressent
# en premier. Ces 512 Mo absorbent les pics sans laisser le calcul s'installer
# dans le swap, qui reste disponible pour les sessions de travail.
MemorySwapMax=512M

# Plafond collectif. Les valeurs ci-dessus ne bornent que CE service ; leur
# somme sur les trois calculateurs vaut 12,5 Go sur 14 Go de RAM. Chacun peut
# donc rester dans son plafond pendant que la machine est asphyxiée.
# calculateurs.slice borne les trois ensemble — voir calculator/calculateurs.slice,
# à installer dans ~/.config/systemd/user/ avant d'activer ce service.
Slice=calculateurs.slice
